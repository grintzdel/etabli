services:
  postgres:
    profiles: ['test']
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: etabli
      POSTGRES_PASSWORD: etabli
      POSTGRES_DB: etabli_test
    ports:
      - '5433:5432'
    # PGDATA moved under /var/lib/postgresql/<major>/docker in the 18 image; the
    # declared volume is still the parent, so the tmpfs has to cover the parent.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U etabli -d etabli_test']
      interval: 1s
      timeout: 3s
      retries: 30

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: etabli
      POSTGRES_PASSWORD: etabli
      POSTGRES_DB: etabli
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U etabli -d etabli']
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "node dist/infrastructure/database/migrate.js && node dist/infrastructure/database/seed.cli.js && node dist/main.js"
    environment:
      DATABASE_URL: postgresql://etabli:etabli@db:5432/etabli
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-at-least-thirty-two-characters}
      PORT: 3001
      NODE_ENV: production
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:3001
      COOKIE_SECURE: 'false'
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  db-data:
